<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>$pagetitle$</title>
	<link rel="icon" href="images/logo.svg" type="image/svg+xml">
$if(highlighting-css)$
	<style>
$highlighting-css$
	</style>
	$endif$
	<link rel="stylesheet" href="style.css">
	<script>
		// Restore the sidebar width before the first paint, so the page doesn't jump
		try {
			const width = localStorage.getItem("sidebar-width");
			if (width) document.documentElement.style.setProperty("--sidebar", width);
		} catch { }
	</script>
</head>

<body>
	<!-- Narrow screens: a top bar with a menu button; the sidebar slides in -->
	<header class="topbar">
		<button class="menu-button" type="button" aria-controls="toc" aria-expanded="false"
			aria-label="Open navigation">☰</button>
		<a class="brand" href="index.html">
			<img src="images/logo.svg" alt="" width="32" height="32">
			<span>Fullerene</span>
		</a>
	</header>
	<div class="backdrop"></div>
	<aside class="sidebar" id="toc">
		<a class="brand" href="index.html">
			<img src="images/logo.svg" alt="" width="40" height="40">
			<span>Fullerene</span>
		</a>
		<nav aria-label="Pages">
			<ul class="pages">
				<li><a href="index.html" $if(current-index)$ aria-current="page" $endif$>⚛️ Layout</a></li>
				<li><a href="keyboards.html" $if(current-keyboards)$ aria-current="page" $endif$>⌨️ Keyboards</a></li>
			</ul>
		</nav>
		$if(toc)$
		<nav class="toc" aria-label="On this page">
			<p class="toc-title">On this page</p>
			$table-of-contents$
		</nav>
		$endif$
		<p class="source"><a href="https://github.com/sobh/fullerene">🐙 Source on GitHub</a></p>
	</aside>
	<main>
		$body$
	</main>
	<script src="sidebar.js"></script>
</body>

</html>
